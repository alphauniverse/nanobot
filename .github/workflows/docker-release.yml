name: Build and Push Docker Image

# ---------------------------------------------------------------------------
# Trigger conditions
# ---------------------------------------------------------------------------
on:
  # 1. Push tag (e.g. v1.0.0, v1.2.3-beta.1)
  push:
    tags:
      - 'v*'

  # 2. Manual trigger with version input
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. v1.2.3 or v1.2.3-beta.1)"
        required: true
        type: string
      is_prerelease:
        description: "Pre-release (do not update latest tag)"
        required: false
        type: boolean
        default: false

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nanobot
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/nanobot

# ---------------------------------------------------------------------------
# Permissions
# ---------------------------------------------------------------------------
permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # Job 1: Build and push multi-arch Docker image
  # =========================================================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------------
      # Step 1: Checkout source code (with submodules if any)
      # ---------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------------
      # Step 2: Set up Docker Buildx (for multi-arch builds)
      # ---------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------------
      # Step 3: Set up QEMU (for cross-platform emulation)
      # ---------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ---------------------------------------------------------------------
      # Step 4: Log in to Docker Hub
      # ---------------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Step 5: Log in to GitHub Container Registry
      # ---------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Step 6: Determine version and tags
      # ---------------------------------------------------------------------
      - name: Determine version and tags
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            IS_PRERELEASE="${{ github.event.inputs.is_prerelease }}"
          else
            # Strip refs/tags/ prefix -> e.g. v1.2.3
            VERSION="${GITHUB_REF#refs/tags/}"
            # Auto-detect prerelease from tag suffix (alpha/beta/rc)
            if echo "$VERSION" | grep -qE '-(alpha|beta|rc)\.'; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "----------------------------------------"
          echo "Version:      ${VERSION}"
          echo "Pre-release:  ${IS_PRERELEASE}"
          echo "----------------------------------------"

      # ---------------------------------------------------------------------
      # Step 7: Docker metadata (labels + tags)
      # ---------------------------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            # Always tag with version
            type=raw,value=${{ steps.vars.outputs.version }}
            # Always tag with "pre" (latest pre-release)
            type=raw,value=pre
            # Tag with "latest" only for formal releases
            type=raw,value=latest,enable=${{ steps.vars.outputs.is_prerelease != 'true' }}

      # ---------------------------------------------------------------------
      # Step 8: Build and push multi-arch image
      # ---------------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.vars.outputs.version }}

      # ---------------------------------------------------------------------
      # Step 9: Print summary
      # ---------------------------------------------------------------------
      - name: Print summary
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.vars.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-release | \`${{ steps.vars.outputs.is_prerelease }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | \`linux/amd64, linux/arm64\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Hub | \`${{ env.IMAGE }}:${{ steps.vars.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GHCR | \`${{ env.GHCR_IMAGE }}:${{ steps.vars.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### All tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Job 2: Test the built image (runs after push)
  # =========================================================================
  test-image:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.result == 'success'

    steps:
      # ---------------------------------------------------------------------
      # Step 1: Log in to GHCR (to pull private images if needed)
      # ---------------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Step 2: Determine version
      # ---------------------------------------------------------------------
      - name: Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Step 3: Pull and test the image
      # ---------------------------------------------------------------------
      - name: Pull and test image
        run: |
          IMAGE="${{ env.GHCR_IMAGE }}:${{ steps.vars.outputs.version }}"
          echo "Testing image: ${IMAGE}"

          # Pull the image
          docker pull "${IMAGE}"

          # Test 1: Container starts and shows version info
          echo "=== Test 1: Container startup ==="
          docker run --rm --entrypoint="" "${IMAGE}" sh -c '
            echo "Python:  $(python3 --version)"
            echo "Node.js: $(node --version)"
            echo "pnpm:    $(pnpm --version)"
            echo "uv:      $(uv --version)"
            echo "rg:      $(rg --version | head -1)"
            echo "fd:      $(fd --version)"
            echo "bat:     $(bat --version)"
            echo "eza:     $(eza --version | head -1)"
            echo "git:     $(git --version)"
            echo "jq:      $(jq --version)"
          '

          # Test 2: Python venv is active
          echo "=== Test 2: Python venv ==="
          docker run --rm --entrypoint="" "${IMAGE}" sh -c '
            which python3 | grep -q "/app/venv" && echo "PASS: venv active" || echo "FAIL: venv not active"
          '

          # Test 3: Chromium is available
          echo "=== Test 3: Chromium ==="
          docker run --rm --entrypoint="" "${IMAGE}" sh -c '
            chromium-browser --version || echo "WARN: Chromium check failed"
          '

          # Test 4: Non-root user
          echo "=== Test 4: Non-root user ==="
          docker run --rm --entrypoint="" "${IMAGE}" whoami | grep -q "nanobot" \
            && echo "PASS: running as nanobot" \
            || echo "FAIL: not running as nanobot"

          # Test 5: Entrypoint script exists and is executable
          echo "=== Test 5: Entrypoint ==="
          docker run --rm --entrypoint="" "${IMAGE}" sh -c '
            test -x /usr/local/bin/entrypoint.sh && echo "PASS: entrypoint executable" || echo "FAIL: entrypoint not executable"
          '

      # ---------------------------------------------------------------------
      # Step 4: Print test summary
      # ---------------------------------------------------------------------
      - name: Test summary
        if: always()
        run: |
          echo "## Image Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ env.GHCR_IMAGE }}:${{ steps.vars.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All basic smoke tests completed. Check logs above for details." >> "$GITHUB_STEP_SUMMARY"
