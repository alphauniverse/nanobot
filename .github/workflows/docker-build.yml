name: Docker Build Check

# ---------------------------------------------------------------------------
# Trigger: PR to main, or manual
# ---------------------------------------------------------------------------
on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # Job: Build test (no push)
  # =========================================================================
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only build for amd64 in PR check (faster)
      - name: Build test (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print result
        run: |
          echo "## Docker Build Check Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Dockerfile builds successfully on linux/amd64." >> "$GITHUB_STEP_SUMMARY"
