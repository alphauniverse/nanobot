# =============================================================================
# GitHub Actions: Build & Push Nanobot Docker Image
# =============================================================================
# Triggers:
#   - Push to main                        → build & push :latest
#   - Tag push (strict semver v1.2.3)     → build & push :1.2.3/:1.2/:1
#   - Pull request (build-related changes)→ build verification only (no push)
#   - Manual dispatch
#
# Note: paths filter is applied via pull_request to avoid the AND semantics
# of paths+tags on push events, which would make tag releases unreliable.
#
# Required Secrets:
#   - DOCKERHUB_USERNAME : Docker Hub username
#   - DOCKERHUB_TOKEN    : Docker Hub access token
# =============================================================================

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      # 严格 semver：v1.2.3 / v1.2.3-beta.1，拒绝 v1、vX.Y 等模糊 tag
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "docker-compose.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# 同一分支/tag 的新提交自动取消旧的构建，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nanobot

jobs:
  build-and-push:
    name: Build & Push (multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up QEMU for cross-platform emulation
      # --------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # --------------------------------------------------
      # 3. Set up Docker Buildx for multi-arch builds
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 4. Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # 5. Extract Docker metadata (tags & labels)
      # --------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 分支 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # semver tags: v1.2.3 → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # --------------------------------------------------
      # 6. Build and push multi-arch image
      # --------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      # --------------------------------------------------
      # 7. Print image summary
      # --------------------------------------------------
      - name: Image summary
        if: success()
        run: |
          echo "### :whale: Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
